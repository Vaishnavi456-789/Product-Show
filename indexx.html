<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <title>Product Store</title>
</head>

<body class="bg-gray-100">

  <h1 class="text-3xl font-bold text-center p-6">
    New Collection
  </h1>

  <div class="flex flex-col md:flex-row flex-wrap
              justify-center gap-6 p-6">

    <!-- Shoes -->
    <div class="bg-white p-4 rounded shadow w-full md:w-64 text-center">
      <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=400"
           alt="Red sports shoes"
           class="w-full h-40 object-cover rounded">
      <h2 class="text-xl font-bold mt-3">Sports Shoes</h2>
      <p>Price: ₹999</p>
      <button class="bg-blue-500 text-white px-4 py-2 mt-3 rounded">
        Buy Now
      </button>
    </div>

    <!-- Watch -->
    <div class="bg-white p-4 rounded shadow w-full md:w-64 text-center">
      <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=400"
           alt="Wristwatch"
           class="w-full h-40 object-cover rounded">
      <h2 class="text-xl font-bold mt-3">Watch</h2>
      <p>Price: ₹1499</p>
      <button class="bg-blue-500 text-white px-4 py-2 mt-3 rounded">
        Buy Now
      </button>
    </div>

  </div>
</body>
</html>
